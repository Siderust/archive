# Siderust Archive — top-level registry.
#
# This file is the single entry point that consumers (siderust's build.rs,
# external pipelines, validators) parse first. Each [[family]] entry points to
# a per-family manifest.toml that fully describes the contained datasets,
# their checksums, and provenance.
#
# Schema: schema/archive-manifest-v1.md

schema_version = 1
archive_name   = "siderust-archive"
archive_version = "0.1.0"

[[family]]
id        = "vsop87"
manifest  = "vsop87/manifest.toml"
kind      = "planetary-theory"
status    = "pending-migration"

