name: Archive Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        description: "Expected commit for a tag push or a generated patch"
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: crates.io
      url: https://crates.io/crates/siderust-archive
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Install stable last so unqualified Cargo commands use it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - name: Validate the exact tagged commit
        run: python3 scripts/archive-release.py validate-tag --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Publish and verify crate, then synchronize the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/archive-release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
