name: Update Time Data

on:
  workflow_dispatch:
  schedule:
    # Monday at 05:23 UTC.
    - cron: "23 5 * * 1"

permissions:
  contents: write

jobs:
  maintenance:
    uses: ./.github/workflows/archive-release.yml
    with:
      mode: auto
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
