name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - run: bash scripts/check-release.sh

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/archive-release.py check-metadata
      - run: python3 -B -m unittest discover -s scripts -p 'test_archive_release.py'

  packaged-docs:
    name: docs.rs (packaged, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - name: Check cargo doc (default, no default features, and all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --locked --no-deps
          cargo doc --locked --no-deps --no-default-features
          cargo doc --locked --no-deps --all-features
      - name: Check docs.rs (packaged, all features)
        run: bash scripts/check-packaged-docs.sh
