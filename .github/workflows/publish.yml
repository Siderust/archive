name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared version on main or an existing release version to resume (e.g. 0.1.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/archive-release.yml
    with:
      mode: manual
      version: ${{ inputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
