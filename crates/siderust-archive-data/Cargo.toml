[package]
name = "siderust-archive-data"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["VPRamon <vallespuigramon@gmail.com>"]
license = "AGPL-3.0-only"
description = "Reusable Rust bindings for the Siderust Archive: manifests, checksums, provenance, and runtime download of scientific datasets (IERS time data, kernels)."
repository = "https://github.com/Siderust/archive"

# The archive is consumed as a git submodule, so this crate must stand alone and
# not be absorbed into a parent repository's cargo workspace.
[workspace]


[features]
default = []
fetch = ["dep:serde_json", "dep:sha2", "dep:ureq"]

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
ureq = { version = "3", optional = true }
