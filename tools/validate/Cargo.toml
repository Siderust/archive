[package]
name    = "archive-validate"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Structural validator for siderust-archive MANIFEST.toml and family manifests."
publish = false

[[bin]]
name = "archive-validate"
path = "src/main.rs"

[dependencies]
serde  = { version = "1", features = ["derive"] }
toml   = "0.8"
sha2   = "0.11"
hex    = "0.4"
